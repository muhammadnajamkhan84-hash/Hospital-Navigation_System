<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Navigatory System — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <div class="logo">Medi<span>Path</span></div>
      <h1>Welcome Back</h1>
      <p>Log in to continue to the hospital navigation system.</p>

      <form class="appt-form" id="loginForm">
        <input type="text" id="loginName" placeholder="Full Name" required>
        <input type="text" id="loginContact" placeholder="Email or Phone Number" required>

        <select id="loginRole" required>
          <option value="" disabled selected>I am here as...</option>
          <option value="visitor">Visitor</option>
          <option value="checkup">Regular Checkup</option>
          <option value="patient">Patient</option>
        </select>

        <button type="submit">Login</button>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
